name: Deploy Portfolio to VPS

on:
  push:
    branches:
      - main

jobs:
  deploy:
    name: Deploy to VPS
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          script: |
            # Pindah ke directory project di VPS (atau clone jika belum ada)
            if [ ! -d "~/portfolio-v2" ]; then
              git clone https://github.com/${{ github.repository }}.git ~/portfolio-v2
            fi
            
            cd ~/portfolio-v2
            
            # Pull kode terbaru dari branch main
            git pull origin main
            
            # Restart dan build container terbaru secara otomatis
            docker compose -f docker-compose.prod.yml up -d --build
            
            # Bersihkan image lama yang tidak terpakai
            docker image prune -f
