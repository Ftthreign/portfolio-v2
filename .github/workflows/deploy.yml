name: Deploy Portfolio to VPS

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy to VPS
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT }}
          script: |
            set -e
            export GIT_TERMINAL_PROMPT=0

            REPO_URL="https://github.com/Ftthreign/portfolio-v2.git"

            if [ ! -d "$HOME/portfolio-v2" ]; then
              git clone "$REPO_URL" "$HOME/portfolio-v2"
            fi

            cd "$HOME/portfolio-v2"

            git remote set-url origin "$REPO_URL"
            git fetch origin master
            git reset --hard origin/master

            echo "Deployed Commit:"
            git log -n 1 --oneline

            docker compose -f docker-compose.prod.yml build --no-cache frontend backend

            docker compose -f docker-compose.prod.yml up -d --remove-orphans

            docker image prune -f
