{{ define "content" }}
<div class="header-bar">
    <div>
        <h2 style="font-family: 'Playfair Display', serif; font-size: 1.8rem;">Pesan Masuk</h2>
        <p style="font-size: 0.85rem; opacity: 0.7; margin-top: 0.2rem;">Daftar pesan dari pengunjung website publik kamu.</p>
    </div>
</div>

<div style="display: flex; flex-direction: column; gap: 1rem;">
    {{ range .Messages }}
    <div class="card" style="margin: 0;">
        <div style="display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 0.5rem;">
            <div>
                <h3 style="font-size: 1.1rem; font-weight: 600;">{{ .Name }}</h3>
                <span style="font-size: 0.8rem; color: var(--terracotta);">{{ .Email }}</span>
            </div>
            <span style="font-size: 0.75rem; opacity: 0.6;">{{ .CreatedAt.Format "02 Jan 2006, 15:04" }}</span>
        </div>
        <p style="font-size: 0.95rem; line-height: 1.6; background: #fff; padding: 1rem; border-radius: 4px; border: 1px solid var(--border); margin-top: 0.5rem;">
            {{ .Message }}
        </p>
    </div>
    {{ else }}
    <div class="card" style="text-align: center; padding: 3rem; opacity: 0.6;">
        Belum ada pesan masuk dari pengunjung.
    </div>
    {{ end }}
</div>
{{ end }}
