<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ .Title }} — Portfolio CMS Admin</title>
    <!-- HTMX -->
    <script src="https://unpkg.com/htmx.org@1.9.10"></script>
    <!-- Quill.js WYSIWYG Editor -->
    <link href="https://cdn.quilljs.com/1.3.6/quill.snow.css" rel="stylesheet">
    <script src="https://cdn.quilljs.com/1.3.6/quill.min.js"></script>
    <!-- Google Fonts: JetBrains Mono -->
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #faf9f5;
            --text: #000000;
            --acid: #A6BA18;
            --border: #000000;
            --card-bg: #F3F2EE;
            --subtle: #E6E4DD;
            --muted: #666666;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'JetBrains Mono', monospace; background: var(--bg); color: var(--text); display: flex; min-height: 100vh; }
        aside { width: 260px; background: var(--card-bg); border-right: 1px solid var(--border); padding: 2rem 1.5rem; display: flex; flex-direction: column; justify-content: space-between; }
        aside h1 { font-family: 'JetBrains Mono', monospace; font-size: 1.15rem; font-weight: 700; margin-bottom: 2rem; letter-spacing: -0.02em; }
        aside nav a { display: block; padding: 0.75rem 1rem; color: var(--text); text-decoration: none; border: 1px solid transparent; font-size: 0.75rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.05em; margin-bottom: 0.5rem; transition: all 0.15s; }
        aside nav a:hover, aside nav a.active { background: var(--text); color: var(--bg); border-color: var(--border); }
        main { flex: 1; padding: 2.5rem; overflow-y: auto; font-family: 'JetBrains Mono', monospace; }
        .header-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 2rem; padding-bottom: 1rem; border-bottom: 1px solid var(--border); }
        .btn { background: var(--text); color: var(--bg); border: 1px solid var(--border); padding: 0.6rem 1.2rem; font-size: 0.75rem; font-weight: 700; font-family: 'JetBrains Mono', monospace; text-transform: uppercase; letter-spacing: 0.05em; cursor: pointer; text-decoration: none; transition: all 0.15s; display: inline-block; }
        .btn:hover { background: var(--acid); color: var(--text); }
        .btn-secondary { background: var(--bg); border: 1px solid var(--border); color: var(--text); }
        .btn-secondary:hover { background: var(--text); color: var(--bg); }
        .card { background: var(--card-bg); border: 1px solid var(--border); border-radius: 0px; padding: 1.5rem; margin-bottom: 1.5rem; }
        table { width: 100%; border-collapse: collapse; margin-top: 1rem; border: 1px solid var(--border); }
        th, td { text-align: left; padding: 0.75rem 1rem; border-bottom: 1px solid var(--border); font-size: 0.8rem; font-family: 'JetBrains Mono', monospace; }
        th { font-weight: 700; text-transform: uppercase; background: var(--subtle); }
        input, textarea, select { width: 100%; padding: 0.6rem 0.8rem; font-family: 'JetBrains Mono', monospace; font-size: 0.85rem; border: 1px solid var(--border); border-radius: 0px; background: #fff; margin-top: 0.4rem; margin-bottom: 1rem; }
        input:focus, textarea:focus { outline: none; border-color: var(--acid); }
        .editor-container { height: 250px; background: #fff; border: 1px solid var(--border); border-radius: 0px; margin-bottom: 1rem; font-family: 'JetBrains Mono', monospace; }
    </style>
</head>
<body>
    <aside>
        <div>
            <h1>ADMIN CMS<span style="color:var(--acid)">_</span></h1>
            <nav>
                <a href="/cms/dashboard" class="{{ if eq .Active "dashboard" }}active{{ end }}">Dashboard</a>
                <a href="/cms/projects" class="{{ if eq .Active "projects" }}active{{ end }}">Projects</a>
                <a href="/cms/blog" class="{{ if eq .Active "blog" }}active{{ end }}">Blog Posts</a>
                <a href="/cms/messages" class="{{ if eq .Active "messages" }}active{{ end }}">Pesan Masuk</a>
                <a href="/" target="_blank" style="margin-top: 2rem; font-size: 0.7rem; opacity: 0.7;">↗ Lihat Website Publik</a>
            </nav>
        </div>
        <div>
            <a href="/cms/logout" class="btn btn-secondary" style="width: 100%; text-align: center;">Logout</a>
        </div>
    </aside>
    <main>
        {{ template "content" . }}
    </main>
</body>
</html>
