<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ .Title }} — Portfolio CMS Admin</title>
    <!-- HTMX -->
    <script src="https://unpkg.com/htmx.org@1.9.10"></script>
    <!-- Quill.js WYSIWYG Editor -->
    <link href="https://cdn.quilljs.com/1.3.6/quill.snow.css" rel="stylesheet">
    <script src="https://cdn.quilljs.com/1.3.6/quill.min.js"></script>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #FDFCF0;
            --text: #2D2D2D;
            --terracotta: #E2725B;
            --sage: #8A9A5B;
            --border: rgba(45, 45, 45, 0.12);
            --card-bg: #F5F4E8;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Geist', sans-serif; background: var(--bg); color: var(--text); display: flex; min-height: 100vh; }
        aside { width: 250px; background: #EFEEE3; border-right: 1px solid var(--border); padding: 2rem 1.5rem; display: flex; flex-col; justify-content: space-between; }
        aside h1 { font-family: 'Playfair Display', serif; font-size: 1.5rem; margin-bottom: 2rem; }
        aside nav a { display: block; padding: 0.75rem 1rem; color: var(--text); text-decoration: none; border-radius: 4px; font-size: 0.9rem; font-weight: 500; margin-bottom: 0.5rem; transition: background 0.2s; }
        aside nav a:hover, aside nav a.active { background: rgba(45, 45, 45, 0.08); color: var(--terracotta); }
        main { flex: 1; padding: 2.5rem; overflow-y: auto; }
        .header-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 2rem; padding-bottom: 1rem; border-bottom: 1px solid var(--border); }
        .btn { background: var(--text); color: var(--bg); border: none; padding: 0.6rem 1.2rem; font-size: 0.85rem; font-weight: 600; border-radius: 4px; cursor: pointer; text-decoration: none; transition: background 0.2s; }
        .btn:hover { background: var(--terracotta); }
        .btn-secondary { background: transparent; border: 1px solid var(--border); color: var(--text); }
        .btn-secondary:hover { background: rgba(45,45,45,0.05); }
        .card { background: var(--card-bg); border: 1px solid var(--border); border-radius: 8px; padding: 1.5rem; margin-bottom: 1.5rem; }
        table { width: 100%; border-collapse: collapse; margin-top: 1rem; }
        th, td { text-align: left; padding: 0.75rem 1rem; border-bottom: 1px solid var(--border); font-size: 0.9rem; }
        th { font-family: 'Playfair Display', serif; font-weight: 600; background: rgba(45,45,45,0.03); }
        input, textarea, select { width: 100%; padding: 0.6rem 0.8rem; font-family: 'Geist', sans-serif; font-size: 0.9rem; border: 1px solid var(--border); border-radius: 4px; background: #fff; margin-top: 0.4rem; margin-bottom: 1rem; }
        input:focus, textarea:focus { outline: none; border-color: var(--terracotta); }
        .editor-container { height: 250px; background: #fff; border-radius: 4px; margin-bottom: 1rem; }
    </style>
</head>
<body>
    <aside>
        <div>
            <h1>Admin CMS<span style="color:var(--terracotta)">.</span></h1>
            <nav>
                <a href="/cms/dashboard" class="{{ if eq .Active "dashboard" }}active{{ end }}">Dashboard</a>
                <a href="/cms/projects" class="{{ if eq .Active "projects" }}active{{ end }}">Projects</a>
                <a href="/cms/blog" class="{{ if eq .Active "blog" }}active{{ end }}">Blog Posts</a>
                <a href="/cms/messages" class="{{ if eq .Active "messages" }}active{{ end }}">Pesan Masuk</a>
                <a href="/" target="_blank" style="margin-top: 2rem; font-size: 0.8rem; opacity: 0.7;">↗ Lihat Website Publik</a>
            </nav>
        </div>
        <div>
            <a href="/cms/logout" class="btn btn-secondary" style="width: 100%; text-align: center;">Logout</a>
        </div>
    </aside>
    <main>
        {{ template "content" . }}
    </main>
</body>
</html>
